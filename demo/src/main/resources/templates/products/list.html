<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sản phẩm</title><link rel="stylesheet" th:href="@{/style.css}"></head><body>
<header><strong>Shop Management</strong><nav><a th:href="@{/products}">Sản phẩm</a><a th:href="@{/categories}">Danh mục</a></nav></header>
<main><div class="toolbar"><h1>Quản lý sản phẩm</h1><a class="button" th:href="@{/products/new}">+ Thêm sản phẩm</a></div>
<form class="filters" method="get" th:action="@{/products}"><div class="field"><label for="name">Tìm theo tên</label><input id="name" name="name" th:value="${name}" placeholder="Nhập tên sản phẩm"></div><div class="field"><label for="categoryId">Danh mục</label><select id="categoryId" name="categoryId"><option value="">Tất cả</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${category.id == categoryId}"></option></select></div><button type="submit">Tìm kiếm</button></form>
<div class="card"><table><thead><tr><th>ID</th><th>Tên</th><th>Giá</th><th>Tồn kho</th><th>Danh mục</th><th>Thao tác</th></tr></thead><tbody>
<tr th:each="product : ${products.content}"><td th:text="${product.id}"></td><td th:text="${product.name}"></td><td th:text="${#numbers.formatDecimal(product.price, 1, 2)}"></td><td th:text="${product.stock}"></td><td th:text="${product.categoryName}"></td><td><div class="actions"><a th:href="@{/products/{id}/edit(id=${product.id})}">Sửa</a><form class="inline" method="post" th:action="@{/products/{id}/delete(id=${product.id})}" onsubmit="return confirm('Xóa sản phẩm này?')"><button class="danger" type="submit">Xóa</button></form></div></td></tr>
<tr th:if="${products.empty}"><td colspan="6" class="muted">Không có sản phẩm phù hợp.</td></tr>
</tbody></table><div class="pagination"><a th:if="${products.hasPrevious()}" th:href="@{/products(name=${name},categoryId=${categoryId},page=${products.number - 1})}">← Trước</a><span th:text="'Trang ' + ${products.number + 1} + ' / ' + ${products.totalPages == 0 ? 1 : products.totalPages}"></span><a th:if="${products.hasNext()}" th:href="@{/products(name=${name},categoryId=${categoryId},page=${products.number + 1})}">Sau →</a></div></div></main></body></html>
