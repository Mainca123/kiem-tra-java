<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danh mục</title><link rel="stylesheet" th:href="@{/style.css}"></head><body>
<header><strong>Shop Management</strong><nav><a th:href="@{/products}">Sản phẩm</a><a th:href="@{/categories}">Danh mục</a></nav></header>
<main><div class="toolbar"><h1>Danh mục sản phẩm</h1><a class="button" th:href="@{/categories/new}">+ Thêm danh mục</a></div>
<div class="alert" th:if="${error}" th:text="${error}"></div>
<div class="card"><table><thead><tr><th>ID</th><th>Tên</th><th>Mô tả</th><th>Thao tác</th></tr></thead><tbody>
<tr th:each="category : ${categories}"><td th:text="${category.id}"></td><td th:text="${category.name}"></td><td th:text="${category.description}"></td><td><div class="actions"><a th:href="@{/categories/{id}/edit(id=${category.id})}">Sửa</a><form class="inline" method="post" th:action="@{/categories/{id}/delete(id=${category.id})}" onsubmit="return confirm('Xóa danh mục này?')"><button class="danger" type="submit">Xóa</button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(categories)}"><td colspan="4" class="muted">Chưa có danh mục.</td></tr>
</tbody></table></div></main></body></html>
